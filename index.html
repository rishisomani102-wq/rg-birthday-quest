<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Little Mystery — RG's Birthday Quest</title>
<meta name="theme-color" content="#E8F5E9">
<style>
:root{--green:#1B5E20;--soft:#E8F5E9;--accent:#A5D6A7;--paper:#fffdf8;--ink:#233126;--muted:#657468;--rose:#b96f83}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;padding:20px;overflow-x:hidden;background:radial-gradient(ellipse at 12% 8%,#ffffff 0,transparent 36%),radial-gradient(ellipse at 88% 92%,#d2e9d4 0,transparent 34%),linear-gradient(145deg,#f7fbf4,#e3f2e5);color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:grid;place-items:center;position:relative}
body:before,body:after{content:"♡";position:fixed;z-index:0;pointer-events:none;color:#6eaa7433;font-family:Georgia,serif;animation:float 8s ease-in-out infinite}
body:before{font-size:clamp(70px,13vw,140px);top:7%;left:5%;transform:rotate(-16deg)}
body:after{content:"✦";font-size:clamp(42px,8vw,84px);bottom:8%;right:7%;animation-delay:-3s}
.card{position:relative;z-index:1;width:min(100%,680px);padding:clamp(24px,5vw,44px);border:1px solid #b5d8b7;border-radius:30px;background:rgba(255,255,252,.92);box-shadow:0 24px 70px #234a251b,0 3px 12px #234a2509;text-align:center;backdrop-filter:blur(8px);animation:card-arrive .8s cubic-bezier(.2,.8,.2,1) both}
.eyebrow{font:11px Arial,sans-serif;letter-spacing:.19em;text-transform:uppercase;color:var(--green)}
h1{font-size:clamp(34px,7vw,52px);line-height:1.08;color:var(--green);font-weight:normal;letter-spacing:-.035em;margin:18px 0}
h2{font-size:clamp(25px,5vw,35px);line-height:1.18;color:var(--green);font-weight:normal;letter-spacing:-.025em;margin:17px 0}
p{font-size:17px;line-height:1.72;margin:16px 0}
.sub{font:13px Arial,sans-serif;color:var(--muted);line-height:1.7}
input,button{font:16px Arial,sans-serif;border-radius:14px;padding:14px 16px;width:100%;margin-top:10px}
input{background:white;border:1px solid #b6d9b8;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--green);box-shadow:0 0 0 4px #a5d6a744}
button{background:linear-gradient(135deg,#276d30,#1b5e20);color:white;border:0;font-weight:700;cursor:pointer;box-shadow:0 5px 12px #1b5e201c;transition:transform .2s ease,box-shadow .2s ease,filter .2s ease}
button:hover{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 8px 18px #1b5e2026}
button:active{transform:translateY(0) scale(.985)}
button:focus-visible{outline:3px solid #b96f83;outline-offset:3px}
button.secondary{background:#f0f8ef;color:var(--green);border:1px solid #b5d8b7;box-shadow:none}
.choices{display:grid;gap:11px;margin-top:22px}
.choice{display:flex;gap:13px;align-items:center;text-align:left;background:#fff;color:var(--ink);border:1px solid #d0e5d0;font-weight:500;box-shadow:0 2px 8px #234a2508;padding:12px 14px;min-height:62px}
.choice:hover{background:#f4faf2;border-color:#8fc596}
.choice .letter{display:grid;place-items:center;flex:0 0 36px;height:36px;border-radius:50%;background:#e6f4e6;color:var(--green);font-weight:bold;transition:transform .2s ease,background .2s ease}
.choice:hover .letter{transform:scale(1.07);background:#d6ecd7}
.photo{margin:24px 0 8px;min-height:165px;border:1px dashed #9dcba1;border-radius:20px;background:linear-gradient(145deg,#f8fcf6,#eef7ed);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;color:#3d7842;font:13px Arial,sans-serif;padding:20px;transition:transform .25s ease,box-shadow .25s ease}
.photo:hover{transform:translateY(-2px);box-shadow:0 8px 22px #234a2510}
.photo .symbol{font-size:35px;color:var(--rose);animation:heartbeat 2.8s ease-in-out infinite}
.photo strong{font-size:14px}
.note{font:12px Arial,sans-serif;color:var(--muted);margin-top:20px;line-height:1.5}
.hidden{display:none!important}
.feedback{margin-top:18px;padding:15px 16px;border:1px solid #d6ead5;border-radius:16px;background:#f0f8f0;color:var(--green);line-height:1.6;animation:feedback-in .35s ease both}
.feedback.wrong{border-color:#f1d4d0;background:#fff4f2;color:#a12d2d;animation:feedback-in .3s ease both}
.progress{font:11px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:17px}
.pill{display:inline-block;border-radius:99px;background:#e8f5e9;border:1px solid #d1e8d2;padding:7px 12px;font:10px Arial,sans-serif;letter-spacing:.12em;color:var(--green)}
.memory{white-space:pre-line}
#slide-content{animation:slide-in .48s cubic-bezier(.2,.8,.2,1) both}
#actions{animation:feedback-in .35s ease both}
@keyframes card-arrive{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes slide-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes feedback-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -13px;rotate:7deg}}
@keyframes heartbeat{0%,100%{transform:scale(1)}8%{transform:scale(1.12)}16%{transform:scale(1)}24%{transform:scale(1.08)}32%{transform:scale(1)}}
@media(max-width:520px){body{padding:12px}.card{padding:25px 18px;border-radius:24px}p{font-size:16px}.photo{min-height:135px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">✦ A small mystery, just for you ✦</div>
  <section id="gate">
    <h1>A Little Mystery</h1>
    <p>Some stories are too special to tell all at once.</p>
    <p class="sub">When the moment feels right, enter the secret word you were given.</p>
    <form id="unlock"><input id="pass" type="password" placeholder="Secret word" autocomplete="off" aria-label="Secret word" required><button type="submit">Unlock the little mystery</button></form>
    <div id="error" class="note" role="status"></div>
  </section>
  <section id="quest" class="hidden" aria-live="polite">
    <div class="progress" id="progress"></div>
    <div id="slide-content"></div>
    <div id="feedback" class="feedback hidden" role="status"></div>
    <div id="actions"></div>
  </section>
  <div class="note">Made with care, for one very special person. ♡</div>
</main>
<script>
// TEMPORARY DEMO GATE ONLY. This passcode is visible in page source.
// Do not add private photos or sensitive messages until server-side protection is deployed.
const DEMO_PASSCODE = "PIGEON25";
const slides = [
 {type:"welcome",title:"THE ADVENTURE BEGINS",body:"today is a very special day. Today's the day when the world's most amazing creature was born. Today's the day when gods most wonderful creation came into existence. Today's the day when RG turns 25. And on this special day, his naya navela boyfriend decided to design a small quest for her to see if one month of dating increased any of her brain cells. So areeee youuu readyyyyyy?",options:["Yes","Definitely yes","Ye bhi koi poochne ki baat hai"]},
 {type:"story",title:"THE ADVENTURE BEGINS",body:"RG is going to embark on a special journey with a secret treasure at the end. But before that here is a funny picture which has no relevance but CCL just think it's funny so it's here😂",photo:"A funny picture goes here"},
 {type:"quiz",title:"QUESTION 1 🧠",body:"What did RG finish when she came to CCL's house while watching movie?",options:["A packet of chocolates","A glass of coffee","A box of khakhara"],correct:2,good:"OHHH, SOMEONE HAS BEEN PAYING ATTENTION! 🧠✨ Maybe those brain cells have increased after all!",bad:"WRONGGGG! 😭 Were you even watching the movie, or were you just there for the snacks? Try again, madam!"},
 {type:"story",title:"THE LEGENDARY KHAKHARA INCIDENT",body:"Well this had to be right. No khakhara was brought in our house for a long time after that day. And remember tune aawle bhar liye the mutthi me🤣🤣🤣🤣 Ek baar khaane ke liye Ghar me kya nhi bulaya tune to hamla hi bol diya ghar ke khaane pe😂",photo:"The khakhara memory photo goes here"},
 {type:"quiz",title:"QUESTION 2 🍫",body:"Which chocolate Rishi used to bring for chap chap each time he visited her?",options:["Dairy milk","Milky Bar","Ferrero Rocher"],correct:1,good:"OHHHH, SHE REMEMBERS THE MILKY BARS! 🤍🥹 Chap Chap was clearly being pampered. Someone's memory is working suspiciously well!",bad:"EXCUSE ME?! 😭 Itna chocolate khilaya aur ab chocolate ka naam hi bhool gayi? Try again, madam! 😂"},
 {type:"quiz",title:"QUESTION 3 🍽️",body:"Which food do CCL and RG love to have at Rishi's place?",options:["Bhindi Roti","Dal Baati","Pav Bhaji"],correct:0,good:"",bad:"WRONGGG! 😭 Think about that favourite meal one more time. Try again! 😂"},
 {type:"memory",title:"BHINDI ROTI. OUR LITTLE CORE MEMORY. 💚",body:"Bhindi roti is going to be one of the core memories that I'll associate with you. Sitting with you there having our favourite meal just brought in a different kind of joy.",photo:"Our Bhindi Roti memory photo goes here"},
 {type:"quiz",title:"THE MOST IMPORTANT QUESTION EVER 💚",body:"How much does CCL love RG?",options:["A lot","Infinity ♾️","More than infinity 💚"],correct:2,good:"",bad:"Infinity is a good start… but is it really enough? Think again. ♾️❤️"}
];
let current=0;
const gate=document.getElementById('gate'),quest=document.getElementById('quest'),content=document.getElementById('slide-content'),feedback=document.getElementById('feedback'),actions=document.getElementById('actions'),progress=document.getElementById('progress');
document.getElementById('unlock').addEventListener('submit',e=>{
 e.preventDefault();
 if(document.getElementById('pass').value===DEMO_PASSCODE){gate.classList.add('hidden');quest.classList.remove('hidden');renderSlide();}
 else document.getElementById('error').textContent='Not quite. Try the secret word again.';
});
function photo(label){return '<div class="photo" role="img" aria-label="'+escapeHTML(label)+'"><span class="symbol">♡</span><strong>'+escapeHTML(label)+'</strong><span>Photo placeholder — we’ll add your picture later.</span></div>'}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderSlide(){
 const s=slides[current];feedback.className='feedback hidden';feedback.textContent='';actions.innerHTML='';
 progress.textContent='YOUR QUEST · '+(current+1)+' / '+slides.length;
 let html='<span class="pill">'+(s.type==='quiz'?'MEMORY CHECK':s.type==='memory'?'A LITTLE MEMORY':'CLUE '+(current+1))+'</span><h2>'+escapeHTML(s.title)+'</h2><p class="'+(s.type==='memory'?'memory':'')+'">'+escapeHTML(s.body)+'</p>';
 if(s.photo)html+=photo(s.photo);
 if(s.options){
  html+='<div class="choices">'+s.options.map((o,i)=>'<button class="choice" data-option="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+escapeHTML(o)+'</span></button>').join('')+'</div>';
 }
 content.innerHTML=html;
 if(s.options){
  content.querySelectorAll('[data-option]').forEach(btn=>btn.addEventListener('click',()=>choose(Number(btn.dataset.option))));
 }else{
  const next=document.createElement('button');next.textContent='Continue →';next.addEventListener('click',advance);actions.appendChild(next);
 }
}
function choose(index){
 const s=slides[current];
 if(s.type!=='quiz'){advance();return;}
 if(index===s.correct){
  feedback.className='feedback';feedback.textContent=s.good||'CORRECT! 🥹❤️';
  content.querySelectorAll('[data-option]').forEach(b=>b.disabled=true);
  const next=document.createElement('button');next.textContent='Continue →';next.addEventListener('click',advance);actions.appendChild(next);
 }else{
  feedback.className='feedback wrong';feedback.textContent=s.bad||'Not quite! Try again 💚';
 }
}
function advance(){if(current<slides.length-1){current++;renderSlide();}else{content.innerHTML='<span class="pill">TO BE CONTINUED</span><h2>The treasure is still waiting… 💚</h2><p>More memories and surprises are on their way.</p><div class="photo"><span class="symbol">♡</span><strong>Secret treasure placeholder</strong><span>We’ll build the ending together.</span></div>';actions.innerHTML='';const restart=document.createElement('button');restart.className='secondary';restart.textContent='Replay the quest';restart.addEventListener('click',()=>{current=0;renderSlide()});actions.appendChild(restart);}}
</script>
</body>
</html>
